[workspace]
resolver = "2"
members = [
    "crypto/bdhke",
    "crates/mint-types",
    "crates/mint-core",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

# This workspace's only cryptographic dependencies are plain secp256k1 and
# sha2. `crypto/bdhke` is a from-scratch BDHKE implementation (see that crate's
# doc comment).
[workspace.dependencies]
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "rand", "serde"] }
sha2 = "0.10"
rand = "0.8.5"
hex = "0.4.3"
sled = "0.34"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.18"
anyhow = "1.0.98"

# No [profile.dev] override needed: the earlier tbs/BLS12-381 design needed
# opt-level = 2 in dev builds because pairing operations in pure Rust are
# slow unoptimized. secp256k1 point operations run through the `secp256k1`
# crate's optimized C library (libsecp256k1) regardless of how the Rust side
# is compiled, so there's nothing to compensate for here.

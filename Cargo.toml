[workspace]
resolver = "2"
members = [
    "crypto/bdhke",
    "crates/mint-types",
    "crates/mint-core",
    "server",
]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["<your project>"]

# No fedimint dependency, no cashu/cdk dependency: this workspace's only
# cryptographic dependency is plain secp256k1. `crypto/bdhke` is a
# from-scratch implementation of Cashu's published BDHKE spec (see that
# crate's doc comment), not vendored source from either project.
[workspace.dependencies]
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "rand", "serde"] }
sha2 = "0.10"
rand = "0.8.5"
hex = "0.4.3"
tokio = { version = "1.48.0", features = ["full"] }
axum = "0.8.8"
sled = "0.34"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
anyhow = "1.0.98"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# No [profile.dev] override needed: the earlier tbs/BLS12-381 design needed
# opt-level = 2 in dev builds because pairing operations in pure Rust are
# slow unoptimized. secp256k1 point operations run through the `secp256k1`
# crate's optimized C library (libsecp256k1) regardless of how the Rust side
# is compiled, so there's nothing to compensate for here.

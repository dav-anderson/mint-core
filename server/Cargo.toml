[package]
name = "mint-server"
description = "Thin single-process HTTP server exposing mint-core over the network."
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[lib]
name = "mint_server"
path = "src/lib.rs"

[[bin]]
name = "mintd"
path = "src/main.rs"

[dependencies]
mint-core = { path = "../crates/mint-core" }
mint-types = { path = "../crates/mint-types" }
axum = { workspace = true }
tokio = { workspace = true }
secp256k1 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
subtle = "2.6"

[dev-dependencies]
bdhke = { path = "../crypto/bdhke" }
# No TLS backend feature on purpose: this client only talks to a local plain-HTTP mint.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rand = { workspace = true }
